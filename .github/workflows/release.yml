# Crea la release automáticamente al publicar una tag v*.
# Adjunta el instalador autocontenido (nordic-env-installer.sh) como asset.
# Las release notes viven en docs/RELEASE.md y se usan como cuerpo.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publicar release con el instalador
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/RELEASE.md
          files: backups/nordic-env-installer.sh
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') }}
