# 99-nordic-greeter.conf — estética Nord del login (lightdm-gtk-greeter)
# Se instala en /etc/lightdm/lightdm-gtk-greeter.conf.d/. El fondo es el
# wallpaper nordic generado por nordic-wallpaper (copia legible para el
# usuario lightdm en /var/lib/lightdm/nordic-greeter-bg.png, la deja install.sh).
[greeter]
background = /var/lib/lightdm/nordic-greeter-bg.png
background-mode = stretch
theme-name = Nordic-darker
icon-theme-name = Papirus
cursor-theme-name = Nordzy-cursors
font-name = JetBrainsMono Nerd Font 10
indicators = ~clock;~spacer;~host;~spacer;~session
screensaver-timeout = 0
