# alacritty.toml — kali-nordic alternativa light
import = [ ]

[env]
TERM = "xterm-256color"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
size = 11.0

[window]
opacity = 0.85
padding = { x = 12, y = 12 }
decorations = "none"
blur = false   # alacritty no acepta blur en X11 de serie; se lo da picom en terminal enmascarada

[colors]
primary = { background = "#2E3440", foreground = "#D8DEE9" }
selection = { background = "#434C5E", foreground = "#D8DEE9" }
cursor = { text = "#2E3440", cursor = "#88C0D0" }

# Palete Nord
[colors.normal]
black   = "#3B4252"; red     = "#BF616A"; green   = "#A3BE8C"; yellow  = "#EBCB8B"
blue    = "#81A1C1"; magenta = "#B48EAD"; cyan    = "#88C0D0"; white   = "#ECEFF4"

[colors.bright]
black   = "#434C5E"; red     = "#BF616A"; green   = "#A3BE8C"; yellow  = "#EBCB8B"
blue    = "#81A1C1"; magenta = "#B48EAD"; cyan    = "#8FBCBB"; white   = "#ECEFF4"

[scrolling]
history = 5000
