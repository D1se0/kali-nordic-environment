# picom.conf — kali-nordic (perfil glass; lite lo genera nordic-blur-toggle)
# xrender en esta VM: llvmpipe (sin aceleración 3D) + glx rompe los visuales ARGB
# de polybar (la barra sale transparente). glx solo con aceleración real.
backend        = "xrender";
vsync          = true;
use-damage     = true;
xrender-sync-fence = true;

# Esquinas redondeadas ligeras
corner-radius = 7;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

# Blur dual-kawase suave — sólido en la terminal, rofi y popups únicamente
# dual_kawase requiere glx; con xrender se usa "none" (o conv si se quiere blur suave)
blur-method    = "none";
blur-strength  = 5;
blur-background-frame = false;
blur-background-exclude = [
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "! name ~= ''",
  "_NET_WM_NAME@:s *= 'kitty-not-blurred'"
];

# Opacidad (glass ~0.80–0.88 sobre terminal/rofi propios; apps manejan la suya)
opacity-rule = [
  "85:class_g  = 'kitty' && focused",
  "80:class_g  = 'kitty' && !focused",
  "88:class_g  = 'Rofi'",
  "84:class_g *= 'Dunst'"
];

fade-in-step = 0.09;
fade-out-step = 0.09;
fade-delta = 6;

# Sin sombras costosas en la VM
shadow = false;

# clothing para wintypes: mantener barebones en VM
wintypes:
{
  normal = {};
  tooltip = { fade = true; shadow = false; border = false; focus = true; full-shadow = false; };
  dock = { shadow = false; blur = false; };
  menu = { blur-background = true; corner-radius = 10; };
  dropdown_menu = { blur-background = true; corner-radius = 10; };
  popup_menu = { blur-background = true; corner-radius = 10; };
  utility = { blur-background = true; corner-radius = 10; };
  notify = { blur-background = true; corner-radius = 11; };
};

# Enfocar ventanas nuevas ligeramente
focus-exclude = [
  "argb != 0"   # exclusiones seguras
];

use-ewmh-active-win = true;

dbus = false;
