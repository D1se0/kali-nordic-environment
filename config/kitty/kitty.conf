# kitty.conf — kali-nordic (glass ~0.85, padding generoso, ligaduras)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
adjust_line_height 5%

# Glass (0.93: un punto más opaco que 0.90)
background_opacity 0.93
background_blur 24
dynamic_background_opacity yes

# Relleno (aire nórdico)
margin: 0
macos_titlebar_color background
window_padding_width 16
scrollback_lines 5000

cursor #88C0D0
cursor_shape beam
cursor_blink_interval 0

# Nord pallete (16 colores)
background #2E3440
foreground #D8DEE9
selection_background #434C5E
selection_foreground #D8DEE9

color0  #3B4252
color1  #BF616A
color2  #A3BE8C
color3  #EBCB8B
color4  #81A1C1
color5  #B48EAD
color6  #88C0D0
color7  #ECEFF4
color8  #434C5E
color9  #BF616A
color10 #A3BE8C
color11 #EBCB8B
color12 #81A1C1
color13 #B48EAD
color14 #8FBCBB
color15 #ECEFF4

url_style dashed
show_hyperlinks_in_targets yes
enable_audio_bell no
bell_on_tab no
visual_bell_duration 0.0

# (F1/F2 de nordic-typeip viven en el zshrc vía bindkey sobre terminfo:
#  F1 = IP propia (VPN priorizada) · F2 = IP de la víctima de settarget)

# Atajo interno: ajustar opacidad con Ctrl+Shift+F1..F5 (ligero opaco → glass)
map ctrl+shift+f1 set_window_opacity 1.0
map ctrl+shift+f2 set_window_opacity 0.90
map ctrl+shift+f3 set_window_opacity 0.85
map ctrl+shift+f4 set_window_opacity 0.80
map ctrl+shift+f5 set_window_opacity 0.88
