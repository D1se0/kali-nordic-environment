# config.ini — polybar kali-nordic (paleta desde config/colors/nord.sh)
[bar/top]
monitor = ${env:MONITOR:}
width = 96%
height = 36
offset-x = 2%
offset-y = 6
bottom = false
background = #D014161B
foreground = #D8DEE9
border-size = 0
radius = 12
padding-left = 14
padding-right = 14
module-margin-left = 5
module-margin-right = 5
wm-restack = bspwm
override-redirect = false
enable-ipc = true
fixed-center = true
; El bloque central se centra en el ancho de la barra (fijo). barleft.sh añade
; un colchón final espejo para que el hueco izq y der del bloque quede igualado.
line-size = 3
line-color = #88C0D0
font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;3"
font-2 = "Noto Sans:size=8;1"
font-3 = "JetBrainsMono Nerd Font Mono:size=10;2"
font-4 = "JetBrainsMono Nerd Font:size=13;2"

# Sin systray: no lo usamos y tray-* está deprecado en polybar 3.7
# y reserva un hueco en la barra.
# Izquierda: identidad + IPs (local, VPN, target) · Centro: disposición de ventanas
# Derecha: recursos (CPU, RAM, disco, reloj) + apagado.
modules-left = barleft
modules-center = workspaces
modules-right = barright power

cursor-click = pointer


[settings]
screenchange-reload = true
pseudo-transparency = true
compositing-background = source
throttle-output = 60

; ==============================================================
; MÓDULO 1: ZONA IZQUIERDA combinada (logo+IP+VPN; clics por píldora)
; ==============================================================
[module/barleft]
type = custom/script
interval = 3
exec = $HOME/.config/polybar/scripts/barleft.sh
format = <label>

; ==============================================================
; MÓDULO 2: TARGET (settarget) — ipc-hook con 2 estados
; ==============================================================
[module/target]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/target.sh empty
hook-1 = ~/.config/polybar/scripts/target.sh set
initial = 1
click-left = sh -c 'bash -c "settarget --copy" 2>/dev/null'

; ==============================================================
; MÓDULO 5 (centro): escritorios bspwm
; notafija: el centro se posiciona dinámicamente (fixed-center=false):
; el hueco a la zona izquierda y a la derecha queda igualado.
; ==============================================================
[module/workspaces]
type = custom/script
tail = true
exec = $HOME/.config/polybar/scripts/workspaces.sh stream
click-left = $HOME/.config/polybar/scripts/workspaces.sh click %_TOKEN_%
scroll-up = bspc desktop -f prev.local
scroll-down = bspc desktop -f next.local

; ==============================================================
; MÓDULO 6: ZONA DERECHA combinada (CPU+RAM+disco+reloj)
; ==============================================================
[module/barright]
type = custom/script
interval = 3
exec = $HOME/.config/polybar/scripts/barright.sh
format = <label>

; ==============================================================
; MÓDULO 10: botón de energía → popup rofi
; ==============================================================
[module/power]
type = custom/script
exec = $HOME/.config/polybar/scripts/power.sh
interval = 0
tail = true
click-left = nordic-power menu
