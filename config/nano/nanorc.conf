# nanorc.conf — kali-nordic: interfaz global estilo VS Code/Nord (nano 9.2)
set linenumbers
set autoindent
set tabsize 4
set tabstospaces
set mouse
set softwrap
set atblanks
set matchbrackets "(<[{)>]}"
set minibar
set indicator
set historylog
set positionlog
set zap
set smarthome
set unix
set locking
set guidestripe 80
set backup
set backupdir "~/.cache/nano/backups"

# interfaz Nord
set titlecolor "bold,white,blue"
set statuscolor "bold,white,green"
set errorcolor "bold,white,red"
set keycolor "cyan"
set functioncolor "cyan"
set numbercolor "brightblack"
set selectedcolor "brightwhite,blue"
